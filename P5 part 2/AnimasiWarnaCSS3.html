<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div{
            width: 100px;
            height: 100px;
            background: red;
            animation: myfirst 5s;
            -webkit-animation: myfirst 5s;
        }
        @keyframes myfirst{
            from {background: red;}
            to {background: yellow;}
        }
        @-webkit-keyframes{
            from {background:red;}
            to {background: yellow;}
        }
    </style>
    <title>CSS3 - Animasi Warna</title>
</head>
<body>
    <h3>Animasi Warna CSS3</h3>
    <div></div>
</body>
</html>

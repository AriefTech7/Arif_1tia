services:
  # Web Server
  web:
    image: httpd:latest
    ports:
      - "8080:80"
    volumes:
      - ./P5 part 1:/usr/local/apache2/htdocs/

  # Database (Pengganti MySQL di XAMPP)
  db:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: poliyu
      MYSQL_DATABASE: test_db
    ports:
      - "3308:3308"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="cekNilai()">Lihat</button>
    <p id="hasil"></p>

    <script>
        function cekNilai(){
            let nilai= 50;
            let status;

            if(nilai> 50){
                status="lulus";
            } else{
                status="tidak lulus";
            }
            document.getElementById("hasil").innerHTML=
            "status qiqi "+status+"<br>"+
            "dengan nilai "+nilai;
            
        }
    </script>
</body>
</html>

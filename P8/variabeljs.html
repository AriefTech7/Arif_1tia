<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="hitung()">hitung</button>
    <!-- onclick berfungsi ketika diklik akan menjalankan function -->
    <p id="hasil"></p> 
    <!-- id="hasil" berfungsi menyimpan output function hitung dan ditampilkan -->
    <script>
        function hitung(){
            let a=10;
            let b=8;
            let tambah = a+b;
            let kurang = a-b;
            let bagi = a/b;
            let kali = a*b;

            document.getElementById("hasil").innerHTML = 
            "Tambah "+tambah+"<br>"+
            "Kurang "+kurang+"<br>"+
            "Bagi "+bagi+"<br>"+
            "Kali "+kali+"<br>"+
            "cawqi";
        }
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menentukan panas atau dingin</title>
    <script>
      var temp = 0;
      var tempbatas = 22;
      temp = Math.floor(Math.random() * 36);
      if (temp < tempbatas) {
        if (temp < 18) {
          alert("Suhu sekarang=" + temp + " pakailah jaket");
          alert("lebih hangat kan?");
        } else {
          alert("Suhu sekarang=" + temp + " pakailah sweater");
          alert("lebih hangat kan?");
        }
      } else {
        if (temp < 27) {
          alert("Suhu sekarang=" + temp + " pakailah baju normal");
        } else {
          alert("Suhu sekarang=" + temp + " pakailah baju tipis");
        }
      }
    </script>
  </head>
  <body>
    <center>
      <h1>Panas atau dingin</h1> 
      <h2>Tekan referesh untuk mengulang</h2>
      <hr />
    </center>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inline</title>
  </head>

  <body style="background-color: pink; font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">
    <fieldset>
      <legend style="color: lightslategrey;font-size: small;">Welcome to Login Page</legend>
      <table>
        <tr>
          <td>Username</td>
          <td>:</td>
          <td><input type="text" placeholder="username" /></td>
        </tr>
        <tr>
          <td>Password</td>
          <td>:</td>
          <td><input type="password" placeholder="password" /></td>
        </tr>
        <tr>
          <td>
            <input type="submit" value="Login" />
          </td>
        </tr>
      </table>
    </fieldset>
  </body>
</html>

<!DOCTYPE html>
<html>
    <title>Modul5-canvas.html</title>
    <body>
        <h1>Menampilkan canvas</h1><br>
        <canvas id="CanvasKu" height="500" width="500">
            <!--definisi ukuran canvas-->
        </canvas>
        <script>
            var canvas=document.getElementById('CanvasKu');
            var ctx=canvas.getContext('2d');
            ctx.fillStyle='#FF0000';
            ctx.fillRect(50,0,100,300);
        </script>
    </body>
</html>

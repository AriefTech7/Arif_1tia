<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        h1{
            text-align: center;
            font-family: 'Open Sans',roboto;
            font-size: 50px;
            color: #F3E4C9;
        }
        body{
            background-color: #A98B80;
        }
        .foto1 {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-left: 95px;
        }
        .foto2 {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .foto3{
            
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .foto4{
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .foto{
            margin-top: 90px;
            display: flex;
            flex-direction: row;
            gap: 150px;
        }
        section.img img{
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 10px 10px 5px  rgba(0,0,0,0.3);
            border: 1px solid black;
            background: #BABF94;
        }
        .shape {
            background: #BABF94;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }
    </style>
    <title>Menu Anak Kos</title>
</head>
<body>
    <header>
        <h1>Menu Anak Kos</h1>
    </header>
    <main>
        <section class="img">
            <div class="foto">
                <div class="foto1">
                    <img src="indomi.jpeg" alt="Indomie Goreng">
                    <div class="shape">
                        <h2>Indomie Goreng</h2>
                    </div>
                </div>
                <div class="foto2">
                    <img src="nasi padang.jpeg" alt="Nasi Padang">
                    <div class="shape">
                        <h2>Nasi Padang</h2>
                    </div>
                </div>
                <div class="foto3">
                    <img src="ayam geprek.jpeg" alt="Ayam Geprek">
                    <div class="shape">
                        <h2>Ayam Geprek</h2>    
                    </div>  
                </div>
                <div class="foto4">
                    <img src="Mie ayam.jpeg" alt="Mie Ayam">
                    <div class="shape">
                        <h2>Mie Ayam</h2>   
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
